<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>หน้าแรก - ภานุพงศ์ บัวทอง</title>

    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Kanit', sans-serif;
        }

        body {
            background: #0f172a;
            color: #f8fafc;
        }

        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 5%;
            z-index: 1000;
            border-bottom: 1px solid #1e293b;
        }

        .logo {
            font-size: 1.2rem;
            font-weight: 600;
            color: #38bdf8;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 20px;
        }

        .nav-links a {
            color: #94a3b8;
            text-decoration: none;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: #38bdf8;
        }

        section {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 100px 20px 40px;
        }

        #home {
            background: linear-gradient(
                135deg,
                #0f172a 0%,
                #1e1b4b 100%
            );
        }

        #home h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        #home h2 {
            font-size: 2rem;
            color: #38bdf8;
            margin-bottom: 20px;
        }

        #home p {
            max-width: 600px;
            color: #cbd5e1;
            font-size: 1.1rem;
            line-height: 1.8;
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 30px;
        }

        .btn {
            padding: 13px 28px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
        }

        .profile-btn {
            background: #38bdf8;
            color: #0f172a;
        }

        .goal-btn {
            border: 1px solid #38bdf8;
            color: #38bdf8;
        }

        .btn:hover {
            transform: translateY(-3px);
        }

        .profile-btn:hover {
            background: #7dd3fc;
        }

        .goal-btn:hover {
            background: #38bdf8;
            color: #0f172a;
        }

        footer {
            text-align: center;
            padding: 20px;
            background: #090d16;
            color: #64748b;
        }

        @media (max-width: 700px) {
            nav {
                flex-direction: column;
                gap: 10px;
            }

            .nav-links {
                gap: 12px;
                flex-wrap: wrap;
                justify-content: center;
            }

            #home h1 {
                font-size: 2rem;
            }

            #home h2 {
                font-size: 1.6rem;
            }
        }
    </style>
</head>

<body>

    <nav>

        <div class="logo">
            Panupong.Dev
        </div>

        <ul class="nav-links">
            <li><a href="index.html">หน้าแรก</a></li>
            <li><a href="profile.html">ประวัติส่วนตัว</a></li>
            <li><a href="goal.html">เป้าหมาย</a></li>
            <li><a href="portfolio.html">แฟ้มสะสมงาน</a></li>
        </ul>

    </nav>


    <section id="home">

        <div>

            <h1>
                ยินดีต้อนรับสู่
            </h1>

            <h2>
                โปรไฟล์ของฉัน
            </h2>

            <p>
                สวัสดีครับ! ผมชื่อ ภานุพงศ์ (Panupong)
                ขณะนี้กำลังศึกษาและสนใจด้าน
                Computer Science & Engineering
            </p>

            <div class="button-group">

                <a href="profile.html" class="btn profile-btn">
                    👤 ดูประวัติส่วนตัว
                </a>

                <a href="goal.html" class="btn goal-btn">
                    🎯 ดูเป้าหมาย
                </a>

            </div>

        </div>

    </section>


    <footer>
        <p>&copy; ภานุพงศ์ บัวทอง - All Rights Reserved</p>
    </footer>

</body>
</html>
