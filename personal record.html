<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ประวัติส่วนตัว - ภานุพงศ์ บัวทอง</title>

    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Kanit', sans-serif;
        }

        body {
            background: #0f172a;
            color: #f8fafc;
        }

        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 5%;
            z-index: 1000;
            border-bottom: 1px solid #1e293b;
        }

        .logo {
            font-size: 1.2rem;
            font-weight: 600;
            color: #38bdf8;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 20px;
        }

        .nav-links a {
            color: #94a3b8;
            text-decoration: none;
        }

        .nav-links a:hover {
            color: #38bdf8;
        }

        .profile-section {
            min-height: 100vh;
            padding: 120px 20px 50px;
            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(
                135deg,
                #0f172a 0%,
                #1e293b 100%
            );
        }

        .card {
            max-width: 550px;
            width: 100%;
            background: #0f172a;
            padding: 40px;
            border-radius: 18px;
            border: 1px solid #334155;
            box-shadow: 0 10px 30px rgba(0,0,0,0.35);
        }

        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            margin: 0 auto 20px;
            border: 3px solid #38bdf8;
        }

        .card h1 {
            text-align: center;
            color: #38bdf8;
            font-size: 2rem;
            margin-bottom: 25px;
        }

        .info-item {
            color: #e2e8f0;
            font-size: 1rem;
            line-height: 1.7;
            padding: 13px 0;
            border-bottom: 1px solid #1e293b;
        }

        .info-item strong {
            color: #94a3b8;
        }

        footer {
            text-align: center;
            padding: 20px;
            background: #090d16;
            color: #64748b;
        }

        @media (max-width: 700px) {
            nav {
                flex-direction: column;
                gap: 10px;
            }

            .nav-links {
                gap: 12px;
                flex-wrap: wrap;
                justify-content: center;
            }

            .card {
                padding: 30px 22px;
            }
        }
    </style>
</head>

<body>

    <nav>

        <div class="logo">
            Panupong.Dev
        </div>

        <ul class="nav-links">
            <li><a href="index.html">หน้าแรก</a></li>
            <li><a href="profile.html">ประวัติส่วนตัว</a></li>
            <li><a href="goal.html">เป้าหมาย</a></li>
            <li><a href="portfolio.html">แฟ้มสะสมงาน</a></li>
        </ul>

    </nav>


    <section class="profile-section">

        <div class="card">

            <img
                src="images.jpg"
                alt="รูปโปรไฟล์ ภานุพงศ์"
                class="profile-img"
            >

            <h1>
                ประวัติส่วนตัว
            </h1>

            <div class="info-item">
                <strong>ชื่อ-นามสกุล:</strong>
                นาย ภานุพงศ์ บัวทอง
            </div>

            <div class="info-item">
                <strong>ชื่อเล่น:</strong>
                ไอซ์
            </div>

            <div class="info-item">
                <strong>วันเกิด:</strong>
                11/09/51
            </div>

            <div class="info-item">
                <strong>ความสนใจ:</strong>
                วิทยาการคอมพิวเตอร์และวิศวกรรม
                (Computer Science & Engineering)
            </div>

        </div>

    </section>


    <footer>
        <p>&copy; ภานุพงศ์ บัวทอง - All Rights Reserved</p>
    </footer>

</body>
</html>
